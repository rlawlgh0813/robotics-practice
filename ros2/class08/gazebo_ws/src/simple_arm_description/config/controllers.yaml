controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_controller:
      type: effort_controllers/JointGroupEffortController
    
    position_controller:
      type: position_controllers/JointGroupPositionController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: {}

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1_z
      - joint1_y
      - joint2
      - joint3
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      joint1_z:
        p: 100.0
        i: 0.0
        d: 5.0
        i_clamp: 0.0
      joint1_y:
        p: 100.0
        i: 0.0
        d: 5.0
        i_clamp: 0.0
      joint2:
        p: 100.0
        i: 0.0
        d: 5.0
        i_clamp: 0.0
      joint3:
        p: 100.0
        i: 0.0
        d: 5.0
        i_clamp: 0.0

effort_controller:
  ros__parameters:
    joints:
      - joint1_z
      - joint1_y
      - joint2
      - joint3

position_controller:
  ros__parameters:
    joints:
      - joint1_z
      - joint1_y
      - joint2
      - joint3